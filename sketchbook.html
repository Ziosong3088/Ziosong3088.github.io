<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sketchbook — Zio Song</title>
<meta name="description" content="Portfolio of Zio Song, 3D animator and artist based in Ottawa, Canada. Maya animation, life drawing, and oil pastel.">
<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

<header>
  <div class="topbar"><nav>
    <a class="logo" href="index.html" style="text-decoration:none">ZIO&nbsp;SONG</a>
    <div class="links">
      <a href="index.html#work">Work</a>
      <a href="index.html#about">About</a>
      <a href="index.html#contact">Contact</a>
    </div>
  </nav></div>
</header>

<main>
  <section>
    <a class="back-link" href="index.html#work">&#8592; Back</a>
    <h2>Sketchbook</h2>
    <!-- ===== Artwork carousel — slides follow the order of the files Zio attached ===== -->
    <div class="carousel" id="carousel" aria-label="Artwork slider">
      <div class="carousel-track" id="carousel-track">
        <div class="carousel-slide"><img src="images/ink-crowd.jpg" alt="Dense black ink drawing of a tangled crowd of figures"></div>
        <div class="carousel-slide"><img src="images/nature-study-1.jpg" alt="Ink nature studies: pine cone, oak leaves, trees and mushrooms"></div>
        <div class="carousel-slide"><img src="images/nature-study-2.jpg" alt="Ink nature studies: willow tree, mushrooms, a snail and a hollow log"></div>
        <div class="carousel-slide"><img src="images/crime-scene.jpg" alt="Ink drawing of investigators examining a crime scene with numbered evidence markers"></div>
        <div class="carousel-slide"><img src="images/cyborg-couple.jpg" alt="Ink and wash drawing of two machine-patched cyborg figures"></div>
      </div>
      <!-- Click the left half of the stage for the previous photo, the right half for the next -->
      <button class="carousel-zone prev" id="zone-prev" aria-label="Previous photo"></button>
      <button class="carousel-zone next" id="zone-next" aria-label="Next photo"></button>
      <div class="carousel-controls">
        <button class="carousel-arrow" id="car-prev" aria-label="Previous photo">&#8249;</button>
        <div class="carousel-dots" id="car-dots"></div>
        <button class="carousel-arrow" id="car-next" aria-label="Next photo">&#8250;</button>
      </div>
    </div>
  </section>
</main>

<footer>
  <p>© 2026 Zio Song · Ottawa, Canada</p>
</footer>

<script src="script.js"></script>

</body>
</html>
